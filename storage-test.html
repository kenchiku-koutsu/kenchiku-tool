<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保存動作の検証｜建築交通整理</title><style>body{font-family:system-ui,sans-serif;max-width:620px;margin:32px auto;padding:0 18px;line-height:1.8;color:#24344b}h1{font-size:1.35rem}input{font-size:18px;padding:12px;width:100%;box-sizing:border-box;border:1px solid #aaa;border-radius:8px}button{font-size:17px;padding:12px 16px;margin:12px 6px 0 0;border-radius:8px;border:1px solid #999;background:#eef4fb}#status{padding:12px;background:#f3f5f7;border-radius:8px}small{color:#555}</style></head><body><h1>入力保存の確認（検証専用）</h1><p>公開中の交通整理ツールとは別の、保存機能だけを確認するページです。</p><label for="entry">テスト文字</label><input id="entry" placeholder="保存テスト123" autocomplete="off"><p id="status" role="status">確認中…</p><button id="save">保存する</button><button id="load">保存内容を再読込</button><p>①「保存テスト123」と入力し「保存する」を押す。②画面を閉じる。③同じURLをもう一度開く。④文字が残っているか確認する。</p><small>このページは個人情報を入力しないでください。ブラウザの保存領域だけを使用します。公開版の入力データには触れません。</small><script>const key='kenchiku-storage-diagnostic-20261111';const input=document.getElementById('entry');const status=document.getElementById('status');function load(){try{const x=localStorage.getItem(key);if(x===null){status.textContent='保存データなし（初回）';input.value=''}else{input.value=x;status.textContent='保存データを読み込みました：'+x}}catch(e){status.textContent='読込失敗：'+e.message}}function save(){try{localStorage.setItem(key,input.value);const x=localStorage.getItem(key);status.textContent=x===input.value?'保存できました（読み返し確認済み）':'保存の確認に失敗しました'}catch(e){status.textContent='保存失敗：'+e.message}}document.getElementById('save').addEventListener('click',save);document.getElementById('load').addEventListener('click',load);load();</script></body></html>
