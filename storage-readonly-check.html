<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保存データの確認（読み取り専用）</title><style>body{font:16px/1.7 system-ui,sans-serif;max-width:650px;margin:20px auto;padding:0 16px;color:#25344b}h1{font-size:1.3em}section{padding:14px;border:1px solid #ccd5df;border-radius:10px;margin:12px 0}strong{display:block}small{color:#536477}button{padding:12px;font:inherit;border-radius:8px}</style><h1>保存データの確認</h1><p>このページは保存済みの内容を読み取るだけです。変更・削除はしません。</p><div id="results">確認中</div><p><small>データの中身や個人情報は表示しません。保存先の種類と、テスト文字の有無だけを確認します。</small></p><script>const keys=[['正式版の保存データ','kenchiku-tool-preview-autosave-20261111'],['項目別の保存データ','kenchiku-tool-category-drafts-v1'],['旧検証版の保存データ','kenchiku-tool-category-preview-20261111']];const out=document.getElementById('results');out.textContent='';for(const [label,key] of keys){const s=document.createElement('section'),h=document.createElement('strong'),p=document.createElement('div');h.textContent=label;try{const raw=localStorage.getItem(key);if(!raw){p.textContent='データなし'}else{let data=JSON.parse(raw);let texts=JSON.stringify(data);const found=['保存テスト789','保存テスト456','あいうえお'].filter(x=>texts.includes(x));p.textContent='データあり ／ テスト文字：'+(found.length?found.join('・'):'該当なし');if(data&&Number.isInteger(data.index)){const q=document.createElement('small');q.textContent='最後に選んだ項目番号：'+(data.index+1);s.appendChild(q)}}}catch(e){p.textContent='確認できません：'+e.message}s.appendChild(h);s.appendChild(p);out.appendChild(s)}</script></html>
